import nu.studer.gradle.jooq.JooqEdition

plugins {
    id 'java'
    id 'application'
    id 'nu.studer.jooq' version '9.0'
}

group = 'com.stocktrader'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def jooqVersion    = '3.19.10'
def javalinVersion = '6.3.0'
def postgresVersion = '42.7.3'
def flywayVersion  = '10.15.0'
def hikariVersion  = '5.1.0'
def jacksonVersion = '2.17.2'
def slf4jVersion   = '2.0.13'

dependencies {
    // HTTP server
    implementation "io.javalin:javalin:${javalinVersion}"

    // JSON
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // Database
    implementation "org.postgresql:postgresql:${postgresVersion}"
    implementation "com.zaxxer:HikariCP:${hikariVersion}"

    // jOOQ
    implementation "org.jooq:jooq:${jooqVersion}"
    jooqGenerator "org.postgresql:postgresql:${postgresVersion}"

    // Flyway migrations
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"

    // Logging
    implementation "org.slf4j:slf4j-simple:${slf4jVersion}"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"
    testImplementation "com.h2database:h2:2.2.224"
    testImplementation "io.javalin:javalin-testtools:${javalinVersion}"
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.stocktrader.Main'
}

jooq {
    version = jooqVersion
    edition = JooqEdition.OSS

    configurations {
        main {
            generationTool {
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = System.getenv('DB_URL') ?: 'jdbc:postgresql://localhost:5432/stocktrader'
                    user = System.getenv('DB_USER') ?: 'postgres'
                    password = System.getenv('DB_PASSWORD') ?: ''
                }
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        inputSchema = 'public'
                        includes = 'portfolio_entries'
                    }
                    generate {
                        deprecated = false
                        records = true
                        immutablePojos = false
                        fluentSetters = true
                    }
                    target {
                        packageName = 'com.stocktrader.db.generated'
                        directory = 'build/generated/jooq'
                    }
                }
            }
        }
    }
}
